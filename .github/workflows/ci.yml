# A merge to main deploys the dashboard. This workflow is that deploy.
#
# The Cloudflare Pages project is a direct upload. It is not connected to this
# repository, so Cloudflare does not build on push. Uploading apps/web/build
# after the gate passes is what publishes https://ldk-server-manager.pages.dev.
#
# Push and pull_request triggers were removed while the repo was private and
# the Actions budget was exhausted: a push trigger then failed the job before
# any step. The repo is public, so those triggers can run again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run, so no minutes are spent on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated protobuf code is committed; fail if it drifts from the .proto files.
      - run: pnpm run generate
      - run: git diff --exit-code -- packages/client/src/gen
      - run: pnpm run ci
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::A merge cannot upload until CLOUDFLARE_API_TOKEN (secret, Pages Edit) and CLOUDFLARE_ACCOUNT_ID (variable) are set on this repository."
            exit 1
          fi
          npx --yes wrangler@4.168.0 pages deploy apps/web/build --project-name=ldk-server-manager
