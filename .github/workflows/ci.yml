# The quality gate for this repo is the Cloudflare Pages build, which runs `pnpm run ci`
# (type check, lint, tests, build) on every push to a connected branch. See README "Deploying".
#
# This workflow is the same gate on GitHub Actions, kept for when it is wanted again. It is
# manual-only (Actions -> CI -> Run workflow) because Actions cannot start on this private
# repo while the account's Actions budget is exhausted; leaving push/pull_request triggers on
# would mark every commit failed without ever running a step. To re-enable, restore:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
# Actions is free for public repositories on standard runners, so making this repo public is
# also enough to bring it back.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated protobuf code is committed; fail if it drifts from the .proto files.
      - run: pnpm run generate
      - run: git diff --exit-code -- packages/client/src/gen
      - run: pnpm run ci

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/goose-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contrib/goose-gateway
      - run: cargo fmt --check
      - run: cargo test --locked
