# Container images: ldk-server, ldk-server-mcp and the web entry point (see docker/README.md).
#
# Manual-only, like CI: Actions cannot start on this private repo while the account's Actions
# budget is exhausted. Run it from Actions -> Images -> Run workflow; nothing is pushed unless
# "push" is ticked. The Rust images build on a native runner per architecture, because
# compiling under QEMU emulation takes hours. The web image needs no emulation: its only
# per-architecture step copies files onto nginx.
name: Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to ghcr.io
        type: boolean
        default: false
      tag:
        description: Tag for the pushed images, e.g. 0.1.0
        type: string
        default: dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  rust:
    strategy:
      matrix:
        image: [ldk-server, ldk-server-mcp]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/ldk-server
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: inputs.push
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  rust-manifest:
    if: inputs.push
    needs: rust
    strategy:
      matrix:
        image: [ldk-server, ldk-server-mcp]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ matrix.image }}:${{ inputs.tag }} \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.image }}:${{ inputs.tag }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/ldk-server-manager-web:${{ inputs.tag }}
          push: ${{ inputs.push }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
