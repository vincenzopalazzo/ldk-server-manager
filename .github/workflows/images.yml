# The web image (see docker/README.md). ldk-server and ldk-server-mcp are built and published by
# https://github.com/vincenzopalazzo/ldk-node-bundle.
#
# Manual. Nothing is pushed unless "push" is ticked. The web image needs no
# emulation: its only per-architecture step copies files onto nginx.
# docker/web/publish.sh is the fallback when Actions cannot run.
name: Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to ghcr.io
        type: boolean
        default: false
      tag:
        description: Tag for the pushed images, e.g. 0.1.0
        type: string
        default: dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/ldk-server-manager-web:${{ inputs.tag }}
          push: ${{ inputs.push }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
