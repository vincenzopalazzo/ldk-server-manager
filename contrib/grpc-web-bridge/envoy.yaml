# Envoy gRPC-Web bridge for ldk-server.
#
# Browsers cannot speak native gRPC (HTTP/2 trailers), so the web UI talks
# gRPC-Web to this proxy, which forwards native gRPC to ldk-server over TLS.
# Request body bytes are passed through unchanged, so the HMAC signature the
# browser computes over the gRPC frame stays valid.
#
# Usage:
#   1. Copy ldk-server's self-signed certificate to ./ldk-server-tls.crt
#      (found at <storage_dir>/tls.crt).
#   2. docker compose up
#   3. Point the web UI at http://localhost:8080 (or put this behind your own TLS).
static_resources:
  listeners:
    - name: grpc_web
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ldk_grpc_web
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ldk_server
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api.LightningNode/" }
                          route:
                            cluster: ldk_server
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex: { regex: ".*" }
                          allow_methods: "GET, POST, OPTIONS"
                          allow_headers: "content-type, x-grpc-web, x-auth, x-user-agent, grpc-timeout"
                          expose_headers: "grpc-status, grpc-message"
                          max_age: "1728000"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: ldk_server
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ldk_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${LDK_SERVER_HOST}
                      port_value: ${LDK_SERVER_PORT}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/envoy/ldk-server-tls.crt }
